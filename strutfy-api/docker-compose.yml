# docker-compose.yml

services:
  postgres:
    image: postgres:17-alpine
    container_name: strutfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strutfy
    ports:
      - "5432:5432"
    volumes:
      - strutfy_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: strutfy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  strutfy_postgres_data: